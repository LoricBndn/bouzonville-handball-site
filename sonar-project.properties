# sonar-project.properties

# --- Propriétés d'identification du projet (à remplacer) ---
sonar.organization=loricbndn
sonar.projectKey=LoricBndn_bouzonville-handball-site
sonar.projectName=Bouzonville Handball Site

# --- Configuration des Sources ---
sonar.sources=src
sonar.tests=src
# Inclure les extensions de fichiers de test pour l'analyse de la dette technique
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- Configuration de la Couverture (pour JS/TS) ---
# Ceci est le paramètre essentiel pour pointer vers le rapport LCOV
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Exclusions pour un meilleur calcul de la couverture ---
# Il est important d'exclure les fichiers qui n'ont pas besoin d'être testés
# (fichiers de types, données, configuration, etc.)
sonar.exclusions=\
  **/*.d.ts,\
  **/types/**,\
  **/data/**,\
  **/lib/**,\
  **/styles/**,\
  **/public/**,\
  **/api/**